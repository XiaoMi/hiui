interface:
  display_name: "HiUI Design"
  short_description: "Plan and generate HiUI React pages through managed page-task plans and generation recipes"
  default_prompt: "Use $hiui-design for HiUI React page generation, modification, integration, migration, legacy/screenshot-to-HiUI translation, or validation. First locate the real project root and confirm the project mode. Do not manually infer page type, topology, generationRecipe, start point, required docs, required actions, acceptance scope, or final report fields. For legacy ordinary pages, keep generation on host-contract + compiled PageSpec + HiuiLegacyPage runtime + typed page slots; old page-component/carrier assets are not generation paths. When required facts are blocked or invalid, stop page generation and explain the missing facts. Treat preflight, governance, formal acceptance, and final-page-report status as delivery evidence only when the selected workflow explicitly asks for them. Do not use this skill for PRD refinement, end-to-end workflow orchestration, Figma canvas writes/design generation, Figma-to-code implementation, or generic React refactoring; route those tasks to the dedicated skill or normal coding flow."
policy:
  allow_implicit_invocation: true
